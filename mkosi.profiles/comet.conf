# Selected via `mkosi --profile=comet build`. Builds Mechanix OS for real
# Mecha Comet (NXP i.MX8M Plus, arm64) hardware: the board's devicetree,
# custom kernel/firmware, and Mechanix app suite. Those packages live in
# mkosi.conf.d/10-packages-hardware.conf, 25-packages-impeller.conf,
# 30-packages-multimedia.conf, 40-packages-mechanix-apps.conf, and
# 45-packages-comet-repo.conf, all gated with [Match] Profiles=comet - they
# aren't included unless this profile is selected. This is the profile
# CI's mkosi-image-build.yml builds. Combine with `release`
# (--profile=comet,release) to also disable root's tty1/serial autologin.

[Distribution]
Architecture=arm64

[Content]
Devicetrees=freescale/imx8mp-mecha-comet.dtb
