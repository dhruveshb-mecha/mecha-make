# Selected via `mkosi --profile=qemu build`.
#
# Builds a minimal image for testing in QEMU on x86-64, since Mecha Comet
# hardware is arm64-only. 10-packages-hardware.conf and
# 40-packages-mechanix-apps.conf are gated with [Match] Profiles=!qemu and
# are skipped under this profile - the Comet firmware/hardware RPMs and
# Mechanix apps aren't built for x86-64. What's left is the base system plus
# phoc/phosh (20-packages-desktop.conf), enough to boot to a Phosh session.

[Output]
Output=mechanix-os-qemu
ImageId=mechanix-os-qemu

[Distribution]
Architecture=x86-64

[Content]
# The base config disables mkosi's own initrd generation (Initrds= cleared
# in mkosi.conf), relying on the Comet kernel RPM to ship its own prebuilt
# initrd and on kernel-install to wire it up. The generic Fedora kernel used
# here does neither, so without an initrd the kernel can't find/mount its
# root filesystem at boot (panics with "VFS: Unable to mount root fs").
# Restore mkosi's default dracut-based initrd generation for this profile.
Initrds=default
# Comet's imx8mp devicetree doesn't apply to a generic x86-64 VM.
Devicetrees=
# The custom Comet kernel is arm64-only; use Fedora's generic x86-64 kernel.
Packages=
    kernel

[Runtime]
# Not needed to boot a minimal Phosh session, and mkosi's swtpm sandboxing
# runs into unprivileged-userns permission issues writing its TPM state dir
# on this host - simplest fix is to skip the vTPM for this profile entirely.
TPM=no
# mkosi defaults to a headless serial console (-nographic). This is a
# graphical Phosh session, so open an actual QEMU display instead.
Console=gui
# Console=gui's own display (SDL + GL, via virtio-vga) segfaults on this
# host regardless of gl=on/off - likely an issue in the Fedora-tools-tree
# qemu build's SDL2/Mesa linkage, not anything image-specific. Override just
# the display backend to VNC (built into qemu core, no SDL/GL involved) -
# QemuArgs= is appended after Console='s own args, so this wins. Connect
# with any VNC viewer to localhost:5900 (display :0) once the VM is running.
QemuArgs=-display vnc=:0
# Approximate the real Mecha Comet hardware (NXP i.MX8M Plus: quad-core
# Cortex-A53, 4/8GB LPDDR4) where it's meaningful on x86-64. GPU/NPU/camera/
# modem/sensors/etc. have no x86 QEMU equivalent and aren't attempted.
CPUs=4
RAM=4G
