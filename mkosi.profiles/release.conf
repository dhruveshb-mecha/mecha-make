# Combine with `comet` (`mkosi --profile=comet,release build`) - on its own
# this profile doesn't select an architecture or any Comet-specific
# packages, see mkosi.profiles/comet.conf.
#
# Disables mkosi's own root-tty1/serial-console autologin, which otherwise
# grants an unauthenticated root shell on /dev/tty1 and /dev/hvc0 regardless
# of the root account being locked (see mkosi.conf). This is independent of
# greetd's autologin into the labwc session as the 'mecha' user, which is
# unaffected by this profile.

[Output]
# Distinct filename for the release build.
Output=mechanix-os-release

[Content]
Autologin=no
