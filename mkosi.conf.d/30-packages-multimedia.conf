# Audio/video/graphics stack used by the camera and media mechanix apps.
# comet-only: gstreamer, gstreamer-devel and libpdfium are only ever built
# for aarch64 in the comet-rpm repo (pkg.mecha.so), and none of this is
# needed once the mechanix apps themselves are gone (see
# 40-packages-mechanix-apps.conf) - so the whole file is only installed for
# the comet profile (see mkosi.profiles/comet.conf).

[Match]
Profiles=comet

[Content]
Packages=
    @multimedia
    gstreamer
    gstreamer-devel
    libpdfium
    mpv
    mpv-devel
    mpv-libs
