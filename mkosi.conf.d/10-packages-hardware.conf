# Mecha Comet (imx8mp) hardware enablement: sensors, camera, wifi/bluetooth,
# power, and the custom kernel/firmware built for this board.

[Content]
Packages=
    bluez
    cpufrequtils
    evtest
    i2c-tools
    libcamera
    libcamera-devel
    libgpiod-utils
    linux-firmware-imx-sdma
    mesa-demos
    upower
    usbutils
    # Custom packages
    nxp-w61x-firmware
    kernel-core-7.1.5-0.mecha.*
    kernel-modules-7.1.5-0.mecha.*
    kernel-modules-core-7.1.5-0.mecha.*
    kernel-modules-extra-7.1.5-0.mecha.*
