# Mecha Comet (imx8mp) hardware enablement: sensors, camera, wifi/bluetooth,
# power, and the custom kernel/firmware built for this board.
# arm64-only: none of this applies to the x86-64 qemu profile (see
# mkosi.profiles/qemu.conf), which uses a generic kernel instead. Matched on
# Profiles rather than Architecture: mkosi.conf.d/*.conf is parsed before
# mkosi.profiles/*.conf, so an Architecture= override made by the profile
# isn't visible yet when this file's [Match] is evaluated.

[Match]
Profiles=!qemu

[Content]
Packages=
    bluez
    cpufrequtils
    evtest
    i2c-tools
    libcamera
    libcamera-devel
    libgpiod-utils
    linux-firmware-imx-sdma
    mesa-demos
    upower
    usbutils
    # Custom packages
    nxp-w61x-firmware
    kernel-7.0.0-2.aarch64
