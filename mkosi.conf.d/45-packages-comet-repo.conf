# The Comet RPM repo (etc/yum.repos.d/mecha-comet-rpm.repo, pointing at
# pkg.mecha.so) lives in its own tree, split out of mkosi.skeleton/, so it
# can be gated separately per profile: dnf syncs metadata for every enabled
# repo even when nothing is installed from it, and the x86-64 qemu profile
# (mkosi.profiles/qemu.conf) installs nothing that comes from pkg.mecha.so.
# See also 50-qemu-no-comet-repo.conf, which drops the matching sandbox tree
# that configures this repo for the build's own dnf invocation.

[Match]
Profiles=comet

[Content]
SkeletonTrees=mkosi.skeleton.comet-repo
