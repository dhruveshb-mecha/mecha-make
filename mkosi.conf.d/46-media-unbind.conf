# /usr/lib/systemd/system-sleep/media-unbind: unbinds the imx8mp media
# drivers (ISI, MIPI-CSI, HDMI PHY, VPU) before suspend so they don't hang
# resume. comet-only: these platform devices don't exist on the x86-64 qemu
# profile (see mkosi.profiles/qemu.conf).

[Match]
Profiles=comet

[Content]
SkeletonTrees=mkosi.skeleton.media-unbind
