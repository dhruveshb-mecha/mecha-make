# Mechanix app suite and its supporting services.
# comet-only: not built for x86-64, so only installed for the comet profile
# (see mkosi.profiles/comet.conf).

[Match]
Profiles=comet

[Content]
Packages=
    mechanix-calculator
    mechanix-camera
    mechanix-clock
    mechanix-contacts
    mechanix-dialer
    mechanix-files
    mechanix-music
    mechanix-notes
    mechanix-settings
    mechanix-system-service
    mechanix-terminal
    mechanix-wallpapers
    mxconf
    mxsearch
    session_service
