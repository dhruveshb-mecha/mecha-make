# Mechanix app suite and its supporting services.
# arm64-only: not built for x86-64, so skipped for the qemu profile (see
# mkosi.profiles/qemu.conf). Matched on Profiles rather than Architecture:
# mkosi.conf.d/*.conf is parsed before mkosi.profiles/*.conf, so an
# Architecture= override made by the profile isn't visible yet when this
# file's [Match] is evaluated.

[Match]
Profiles=!qemu

[Content]
Packages=
    mechanix-calculator
    mechanix-camera
    mechanix-clock
    mechanix-contacts
    mechanix-dialer
    mechanix-files
    mechanix-music
    mechanix-notes
    mechanix-settings
    mechanix-system-service
    mechanix-terminal
    mechanix-wallpapers
    mxconf
    mxsearch
    session_service
