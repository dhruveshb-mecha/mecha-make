# Impeller (Flutter's rendering engine) backs the Mechanix Flutter apps
# (40-packages-mechanix-apps.conf). It's only ever built for aarch64 in the
# comet-rpm repo (pkg.mecha.so), so - like those apps - it's only installed
# for the comet profile (see mkosi.profiles/comet.conf).

[Match]
Profiles=comet

[Content]
Packages=
    impeller
