# Impeller (Flutter's rendering engine) backs the Mechanix Flutter apps
# (40-packages-mechanix-apps.conf). It's only ever built for aarch64 in the
# comet-rpm repo (pkg.mecha.so), so - like those apps - it's skipped for the
# x86-64 qemu profile (see mkosi.profiles/qemu.conf).

[Match]
Profiles=!qemu

[Content]
Packages=
    impeller
