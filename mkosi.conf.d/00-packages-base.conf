# Core OS: comps groups, init/login stack, and general CLI tools.
# Groups are defined at https://pagure.io/fedora-comps/blob/main/f/comps-f43.xml.in

[Content]
Packages=
    @core
    @networkmanager-submodules
    @standard
    htop
    nano
    openssh-server
    seatd
    sudo
    systemd
    systemd-boot-unsigned
    systemd-pam
    # Provides bootctl, needed to install the systemd-boot loader
    # (Bootloader=systemd-boot in mkosi.conf) - not pulled in by @core/
    # @standard under install_weak_deps=0.
    systemd-udev
    xdg-user-dirs
