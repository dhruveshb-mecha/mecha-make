# mkosi.sandbox/ only configures the Comet RPM repo (pkg.mecha.so) for the
# tools mkosi runs during the build (dnf inside the build sandbox). Drop it
# for the qemu profile so an x86-64 build doesn't need that host reachable
# for a repo it installs nothing from. See also 45-packages-comet-repo.conf,
# which handles the equivalent tree for the image's own rootfs.

[Match]
Profiles=qemu

[Build]
SandboxTrees=
