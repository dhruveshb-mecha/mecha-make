packages:
  - firmware.group
  - linux.group
  - system.group
  - network.group
  - build.group
  - locale.group
  - wayland.group
  - greeter.group
  - audio.group
  - graphics.group
  - mechanix.group
package_groups:
  - name: firmware
    packages:
      - uboot-tools

  - name: system
    packages:
      - dbus
      - nano
      - openssh-server
      - sudo
      - bash-completion
      - dosfstools
      - cpufrequtils
      - upower
      - libglib2.0-0
  - name: network
    packages:
      - bluez
      - hostapd
      - file
      - ethtool
      - network-manager
      - net-tools
      - curl
      - wget
      - unzip
  - name: build
    packages:
      - python3
  - name: graphics
    packages:
      - mesa-utils
  - name: locale
    packages:
      - systemd-timesyncd
      - locales
      # - systemd-services
  - name: wayland
    packages:
      - xwayland
      - xorg
      - labwc
      - weston
  - name: greeter
    packages:
      - greetd
  - name: audio
    packages:
      - pulseaudio
      - mpg123
      - pulseaudio-module-bluetooth
      - alsa-tools
      - alsa-utils
  - name: mechanix
    packages:
      - mechanix-camera-0:0.1.17-1.aarch64
      - mechanix-files-0:0.1.17-1.aarch64
      - mechanix-keyboard-0:0.1.20-1.aarch64
      - mechanix-launcher-0:0.1.20-1.aarch64
      - mechanix-settings-0:0.1.17-1.aarch64
      - mechanix_desktop_dbus_server-0:0.1.12-1.aarch64
      - mechanix_system_dbus_server-0:0.1.12-1.aarch64
      - alacritty
