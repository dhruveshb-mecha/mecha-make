[Distribution]
Distribution=kali
Release=kali-rolling
Architecture=arm64

[Output]
Format=disk
Output=mechanix-kali-rolling
SectorSize=512
CompressOutput=no
SplitArtifacts=

[Build]
Environment=DEBIAN_FRONTEND=noninteractive

[Content]
Bootable=yes
Autologin=no
Hostname=comet
UnifiedKernelImages=no
Devicetrees=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
KernelCommandLine=audit=0
KernelCommandLine=audit=0

Packages=
    apt
    bash
    bash-completion
    bluez
    ca-certificates
    coreutils
    curl
    dbus
    dbus-user-session
    evtest
    git
    hashcat
    htop
    hydra
    i2c-tools
    iputils-ping
    john
    kali-desktop-kde
    libbpf1
    libgl1-mesa-dri
    libgpiod-dev
    libnss-systemd
    libpam-modules
    libpam-runtime
    libpam-systemd
    libseccomp2
    locales
    login
    mesa-utils
    nano
    ncurses-term
    net-tools
    openssh-server
    passwd
    rsync
    screen
    sddm
    socat
    sqlmap
    sudo
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-resolved
    systemd-timesyncd
    tcpdump
    tmux
    tshark
    upower
    usbutils
    util-linux
    vim
    wget
    xauth
    xdg-user-dirs
    avahi-daemon
    geoclue-2.0
    kscreen
    libnss-mdns
    xserver-xorg-video-fbdev
    xserver-xorg-video-modesetting

# Cybersecurity tools
Packages=
    kali-linux-core
    kali-linux-default
    kali-tools-rfid
    kali-linux-firmware
    kali-linux-nethunter
    kali-system-cli
    kali-system-core

# Custom packages
Packages=
    linux-image-6.12.20+mecha+