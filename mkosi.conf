[Distribution]
Distribution=fedora
Release=43
Architecture=arm64

[Output]
Format=disk
Output=fedora43
SectorSize=512
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
Autologin=yes
Hostname=comet
UnifiedKernelImages=no
KernelModulesInitrd=no
# Disable mkosi-generated initrd
Initrds=
Devicetree=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
PostInstallationScripts=mkosi.postinst

# Include standard groups, they are defined at
# https://pagure.io/fedora-comps/blob/main/f/comps-f43.xml.in

Packages=
    @base-graphical
    @core
    @kde-mobile
    @kde-mobile-apps
    @multimedia
    @networkmanager-submodules
    @standard
    alacritty
    bluez
    cpufrequtils
    evtest
    google-noto-emoji-fonts
    google-noto-fonts-all
    htop
    i2c-tools
    libgpiod-utils
    mesa-demos    
    nano
    openssh-server   
    sudo
    systemd
    systemd-boot-unsigned
    upower
    usbutils
    # vercel-geist-mono-fonts -> only available in testing for Fedora 43
    weston
    weston-demo
    xdg-user-dirs
    xorg-x11-server-Xwayland

# Custom packages

Packages=
    nxp-firmware-1.0-1.fc43.aarch64
    kernel-6.19.0-2.aarch64
    squeekboard-1.43.1-2.fc42
