[Distribution]
Distribution=kali
Release=kali-rolling
Architecture=arm64

[Output]
Format=disk
Output=kali-rolling
SectorSize=512
CompressOutput=no
SplitArtifacts=

[Content]
Bootable=yes
Autologin=no
Hostname=comet
UnifiedKernelImages=no
Devicetrees=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
Environment=DEBIAN_FRONTEND=noninteractive
KernelCommandLine=quiet loglevel=3 audit=0
PostInstallationScripts=mkosi.postinst

Packages=
    apt
    bash
    bash-completion
    bluez
    ca-certificates
    curl
    dbus
    dbus-user-session
    evtest
    git
    hashcat
    htop
    hydra
    i2c-tools
    iputils-ping
    john
    libbpf1
    libgpiod-dev
    libnss-systemd
    libpam-modules
    libpam-runtime
    libpam-systemd
    libseccomp2
    login
    nano
    net-tools
    nmap
    openssh-server
    passwd
    rsync
    screen
    socat
    sqlmap
    sudo
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-resolved
    tcpdump
    tmux
    tshark
    upower
    usbutils
    util-linux
    vim
    wget
    xdg-user-dirs

# Custom packages
Packages=
    linux-image-6.12.20+mecha+