[Distribution]
Distribution=fedora
Release=43
Architecture=arm64

[Output]
Format=disk
Output=fedora43
SectorSize=512
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
Autologin=yes
Hostname=comet
UnifiedKernelImages=no
KernelModulesInitrd=no
# Disable mkosi-generated initrd
Initrds=
Devicetree=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
PostInstallationScripts=mkosi.postinst

# Include standard groups, they are defined at
# https://pagure.io/fedora-comps/blob/main/f/comps-f43.xml.in

Packages=
    @base-graphical
    @core
    @multimedia
    @networkmanager-submodules
    @standard
    alacritty
    bluez
    cpufrequtils
    dconf
    evtest
    greetd
    gsettings-desktop-schemas
    gstreamer
    htop
    i2c-tools
    impeller
    libcamera
    libgpiod-utils
    libpdfium
    mechanix-extension-service
    mechanix-settings
    mechanix-system-service    
    mesa-demos
    mpv-devel
    mpv-libs
    mpv
    mutter
    mxconf
    mxsearch
    nano
    openssh-server
    phoc
    phosh
    phosh-mobile-settings
    seatd
    session_service
    squeekboard
    sudo
    systemd
    systemd-boot-unsigned
    upower
    usbutils
    # vercel-geist-mono-fonts -> only available in testing for Fedora 43
    weston-demo
    xdg-user-dirs
    xorg-x11-server-Xwayland

# Custom packages

Packages=
    nxp-firmware-1.0-1.fc43.aarch64
    kernel-7.0.0-2.aarch64
