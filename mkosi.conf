[Distribution]
Distribution=fedora
Release=43
Architecture=arm64

[Output]
Format=disk
Output=fedora43
SectorSize=512
CompressOutput=no

[Content]
Bootable=yes
Autologin=yes
Hostname=comet
UnifiedKernelImages=no
Devicetree=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
PostInstallationScripts=mkosi.postinst

# Include standard groups, they are defined at
# https://pagure.io/fedora-comps/blob/main/f/comps-f43.xml.in

Packages=
    @core
    @networkmanager-submodules
    @standard
    alacritty
    bluez
    cpufrequtils
    evtest
    greetd
    gsettings-desktop-schemas
    htop
    i2c-tools
    libgpiod-utils
    mechanix-extension-service
    mechanix-files
    mechanix-keyboard
    mechanix-launcher
    mechanix-music
    mechanix-notes
    mechanix-settings
    mechanix-system-service
    mesa-demos
    mesa-dri-drivers
    mesa-vulkan-drivers
    mpv-devel
    mutter
    mxconf
    mxsearch
    nano
    openssh-server
    phoc
    pipewire
    plymouth
    seatd
    session_service
    sudo
    systemd
    systemd-boot-unsigned
    upower
    usbutils
    weston-demo
    xdg-user-dirs
    xorg-x11-server-Xwayland

# Custom packages

Packages=
    nxp-firmware-1.0-1.fc43.aarch64
    # kernel-6.12.20+mecha+-2.aarch64
    # Hdmi kernel patch 
    kernel-6.12.20+mecha-2.aarch64