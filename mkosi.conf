[Distribution]
Distribution=kali
Release=kali-rolling
Architecture=arm64

[Output]
Format=disk
Output=mechanix-kali-rolling
SectorSize=512
CompressOutput=no
SplitArtifacts=

[Build]
Environment=DEBIAN_FRONTEND=noninteractive

[Content]
Bootable=yes
Autologin=no
Hostname=comet
UnifiedKernelImages=no
Devicetrees=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
KernelCommandLine=audit=0
KernelCommandLine=audit=0

Packages=
    apt
    bash
    bash-completion
    bluez
    ca-certificates
    coreutils
