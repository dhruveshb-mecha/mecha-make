[Distribution]
Distribution=kali
Release=kali-rolling
Architecture=arm64

[Output]
Format=disk
Output=kali-rolling
SectorSize=512
CompressOutput=no

[Content]
Bootable=yes
Autologin=yes
Hostname=comet
UnifiedKernelImages=no
Devicetrees=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
Environment=DEBIAN_FRONTEND=noninteractive
PostInstallationScripts=mkosi.postinst

Packages=
    bluez
    evtest
    htop
    i2c-tools
    libgpiod-dev
    nano
    git
    openssh-server
    sudo
    systemd
    upower
    usbutils
    xdg-user-dirs

# Custom packages
Packages=
    linux-image-6.12.20+mecha+