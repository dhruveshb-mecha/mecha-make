name: Kali Rolling mkosi Image Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      MKOSI_OUTPUT: mechanix-kali-rolling.raw
      IMAGE_PREFIX: mechanix-kali-rolling

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3-pip \
            python3-venv \
            python3-cryptography \
            python3-pefile \
            systemd-container \
            debootstrap \
            btrfs-progs \
            squashfs-tools \
            dosfstools \
            mtools \
            fdisk \
            cpio \
            wget \
            util-linux \
            e2fsprogs \
            xz-utils \
            tar \
            zstd \
            cryptsetup-bin \
            kmod \
            gnupg \
            openssl \
            jq \
            systemd-boot

      - name: Install mkosi v26
        run: |
          set -euxo pipefail
          python3 -m venv venv
          ./venv/bin/pip install "git+https://github.com/systemd/mkosi.git@v26"
          echo "$(pwd)/venv/bin" >> $GITHUB_PATH

      - name: Install Kali Keyring
        run: |
          set -euxo pipefail
          wget http://http.kali.org/kali/pool/main/k/kali-archive-keyring/kali-archive-keyring_2025.1_all.deb
          sudo apt-get install -y ./kali-archive-keyring_2025.1_all.deb

      - name: Fetch custom kernel
        run: |
          set -euxo pipefail
          cd mkosi.packages
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/linux-image-6.12.20%2Bmecha%2B_6.12.20-g731cb060569c-2_arm64.deb

      - name: Build image with mkosi
        run: |
          set -euxo pipefail
          sudo env "PATH=$PATH" mkosi -f build
          test -f "${MKOSI_OUTPUT}"

      - name: Prepare image artifact
        run: |
          set -euxo pipefail
          TS=$(date -u +"%Y%m%d-%H%M")
          FINAL_NAME="mechanix-kali-rolling-${TS}.raw"
          mkdir -p out
          mv "${MKOSI_OUTPUT}" "out/${FINAL_NAME}"
          echo "IMAGE_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: out/${{ env.IMAGE_NAME }}
