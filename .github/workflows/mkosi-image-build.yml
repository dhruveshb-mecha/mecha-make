name: Fedora 43 mkosi Image Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: plasma-mobile
            mkosi_profile: ""
            mkosi_output: fedora43.raw
            artifact_prefix: plasma-mobile-os
          - name: xfce
            mkosi_profile: "--profile xfce"
            mkosi_output: fedora43-xfce.raw
            artifact_prefix: xfce-os

    container:
      image: fedora:43
      options: --privileged

    env:
      MKOSI_OUTPUT: ${{ matrix.variant.mkosi_output }}
      MKOSI_PROFILE: ${{ matrix.variant.mkosi_profile }}
      IMAGE_PREFIX: ${{ matrix.variant.artifact_prefix }}

    steps:
      # 1. Checkout repo (instead of git clone)
      - name: Checkout mkosi-mecha
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install prerequisites
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y update
          dnf -y install \
            mkosi \
            systemd \
            systemd-repart \
            git \
            wget \
            util-linux \
            e2fsprogs \
            dosfstools \
            squashfs-tools \
            xz \
            tar

      # 3. Cache DNF packages
      - name: Cache DNF
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: dnf-${{ runner.os }}-${{ matrix.variant.name }}-${{ hashFiles('mkosi.conf', 'mkosi.conf.d/**', 'mkosi.profiles/**', 'mkosi.skeleton/**', 'mkosi.repart/**', 'mkosi.postinst', 'mkosi.postinst.chroot', 'mkosi.finalize') }}
          restore-keys: |
            dnf-${{ runner.os }}-${{ matrix.variant.name }}-
            dnf-${{ runner.os }}-

      # 4. Download custom RPMs
      - name: Fetch custom kernel & firmware
        run: |
          set -euxo pipefail
          cd mkosi.packages
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/kernel-6.12.20%2Bmecha-2.aarch64.rpm
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/firmware-nxp-wifi-nxpiw612.fc43.aarch64.rpm
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/squeekboard-1.43.1-2.fc42.aarch64.rpm

      # 5. Build image
      - name: Build image with mkosi
        run: |
          set -euxo pipefail
          mkosi ${MKOSI_PROFILE} -f build
          test -f "${MKOSI_OUTPUT}"

      # 6. Rename image with timestamp and upload
      - name: Move image with timestamp
        run: |
          set -euxo pipefail

          TS=$(date -u +"%Y%m%d-%H%M")
          FINAL_NAME="${IMAGE_PREFIX}-${TS}.raw"

          mkdir -p /opt/mecha
          mv "${MKOSI_OUTPUT}" /opt/mecha/${FINAL_NAME}

          echo "IMAGE_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload mkosi image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /opt/mecha/${{ env.IMAGE_NAME }}
