name: Fedora 43 mkosi Image Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: fedora:43
      options: --privileged

    env:
      MKOSI_OUTPUT: fedora43.raw
      IMAGE_PREFIX: mechanix-os

    steps:
      # 1. Checkout repo (instead of git clone)
      - name: Checkout mkosi-mecha
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install prerequisites
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y update
          dnf -y install \
            mkosi \
            systemd \
            systemd-repart \
            git \
            dconf \
            python3 \
            wget \
            util-linux \
            e2fsprogs \
            dosfstools \
            squashfs-tools \
            xz \
            tar

      # 3. Cache DNF packages
      - name: Cache DNF
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: dnf-${{ runner.os }}-${{ hashFiles('mkosi.conf') }}
          restore-keys: |
            dnf-${{ runner.os }}-

      # 4. Download custom RPMs
      - name: Fetch custom kernel & firmware
        run: |
          set -euxo pipefail
          cd mkosi.packages
          
          # Fetch kernel from GitHub releases
          KERNEL_URL="$(python3 - <<'PY'
          import json
          import re
          import sys
          import urllib.request

          api_url = "https://api.github.com/repos/dhruveshb-mecha/linux/releases?per_page=10"
          req = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mecha-mkosi-image-build",
              },
          )

          with urllib.request.urlopen(req) as response:
              releases = json.load(response)

          pattern = re.compile(r"^kernel-[0-9].*\.aarch64\.rpm$")
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  if pattern.match(name):
                      print(asset["browser_download_url"])
                      sys.exit(0)

          raise SystemExit("No published kernel RPM asset found in recent dhruveshb-mecha/linux releases")
          PY
          )"
          
          wget "$KERNEL_URL"
          
          # Compute and log SHA256 of kernel
          KERNEL_FILE=$(ls kernel-*.aarch64.rpm)
          KERNEL_SHA256=$(sha256sum "$KERNEL_FILE" | cut -d' ' -f1)
          echo "Kernel: $KERNEL_FILE" | tee build-info.txt
          echo "SHA256: $KERNEL_SHA256" | tee -a build-info.txt
          echo "$KERNEL_SHA256  $KERNEL_FILE" > kernel-checksum.sha256
          
          # Fetch firmware and squeekboard
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/firmware-nxp-wifi-nxpiw612.fc43.aarch64.rpm
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/squeekboard-1.43.1-2.fc42.aarch64.rpm

      # 5. Build image
      - name: Build image with mkosi
        run: |
          set -euxo pipefail
          mkosi -f build
          test -f "${MKOSI_OUTPUT}"

      # 6. Rename image with timestamp and upload
      - name: Move image with timestamp
        run: |
          set -euxo pipefail

          TS=$(date -u +"%Y%m%d-%H%M")
          FINAL_NAME="mechanix-os-${TS}.raw"

          mkdir -p /opt/mecha
          mv fedora43.raw /opt/mecha/${FINAL_NAME}

          echo "IMAGE_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-checksums
          path: mkosi.packages/kernel-checksum.sha256

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: mkosi.packages/build-info.txt

      - name: Upload mkosi image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /opt/mecha/${{ env.IMAGE_NAME }}
