name: kernel Build
on:
  push:
    branches:
      - main
      - dev*
    paths:
      - kernel/**  
      - .github/workflows/kernel-build.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        machine: [mecha-comet-gen1]
    runs-on: ubuntu-22.04
    container:
      image: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf -y update
          dnf -y install sudo curl git rsync cpio @development-tools bc make gcc elfutils-libelf-devel openssl-devel flex bison dwarves ncurses-devel cpio rsync openssl-devel-engine rpm-build rpmdevtools dwarves openssl perl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Git SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GIT }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Nushell
        run: |
          curl -L https://github.com/nushell/nushell/releases/download/0.95.0/nu-0.95.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          mv nu-0.95.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/
          rm -rf nu-0.95.0-x86_64-unknown-linux-gnu

      - name: Build Directory
        run: mkdir -p build

      - name: Run Kernel Build Script
        run: |
          cd kernel
          nu build.nu ${{ matrix.machine }} ../build

      - name: List all files
        run: ls -laR build/deploy

      - name: Prepare Kernel artifacts
        run: |
          mkdir artifacts
          cp -r ./build/deploy/* ./artifacts

      - name: List all Artifacts
        run: ls -laR artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: ./artifacts/*

