name: QEMU Test Image Build

# Builds the x86-64 `qemu` profile image (phoc/phosh only, no Mechanix apps -
# see README.md "Testing in QEMU") and uploads it as a workflow artifact, so
# anyone with access to this repo's Actions runs can download and boot it
# without setting up mkosi themselves.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Same base as mkosi-image-build.yml: building this profile's Fedora
    # tools tree (mkosi.conf's [Build] section) needs a working dnf/rpm
    # somewhere to bootstrap from, which a plain ubuntu-latest runner has
    # neither of.
    container:
      image: fedora:44
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y update
          dnf -y install \
            python3 \
            pipx \
            systemd \
            systemd-repart \
            git \
            util-linux \
            e2fsprogs \
            dosfstools \
            squashfs-tools \
            xz \
            tar \
            distribution-gpg-keys \
            fedora-repos

      # mkosi.conf relies on settings (ToolsTreeDistribution=, ToolsTreePackages=,
      # QemuArgs=, Devicetrees=) that Fedora 44's dnf-packaged mkosi (an
      # earlier "26" snapshot) doesn't have yet, unlike the actual v26 git
      # tag. Install from git instead of `dnf install mkosi`.
      - name: Install mkosi
        run: |
          set -euxo pipefail
          pipx install git+https://github.com/systemd/mkosi.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Configure the mecha user's password from a repo secret (never
      # committed to git). Root has no password mechanism at all - see
      # mkosi.conf. If CI_MECHA_USER_PASSWORD isn't configured, the build
      # falls back to the secure default: the mecha user ships locked.
      
      - name: Configure CI credentials
        env:
          CI_MECHA_USER_PASSWORD: ${{ secrets.CI_MECHA_USER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CI_MECHA_USER_PASSWORD}" ]; then
            printf 'MECHA_USER_PASSWORD=%s\n' "${CI_MECHA_USER_PASSWORD}" > mkosi.env
            chmod 600 mkosi.env
          fi

      - name: Build qemu profile image
        run: |
          set -euxo pipefail
          mkosi --profile=qemu -f build
          test -f mechanix-os-qemu.raw

      - name: Upload image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanix-os-qemu-raw
          path: mechanix-os-qemu.raw

      - name: Upload run script artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-qemu-standalone
          path: run-qemu-standalone.sh
