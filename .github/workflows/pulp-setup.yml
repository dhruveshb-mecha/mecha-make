name: Pulp CLI Configuration Workflow

on:
  workflow_call:

jobs:
  pulp-cli-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install pulp-cli with pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install pulp-cli[pygments]
          # Verify installation
          which pulp

      - name: Create Pulp CLI config
        run: |
          mkdir -p ~/.config/pulp
          cat > ~/.config/pulp/cli.toml << 'EOF'
          [cli]
          username = "${{ secrets.PULP_USERNAME }}"
          password = "${{ secrets.PULP_PASSWORD }}"
          base_url = "${{ secrets.PULP_BASE_URL }}"
          api_root = "/pulp/"
          domain = "default"
          headers = []
          cert = ""
          key = ""
          verify_ssl = true
          format = "json"
          dry_run = false
          timeout = 0
          verbose = 0
          EOF

      - name: Check Pulp status
        run: pulp status


      - name: List repositories
        run: |
          # Example of listing repositories
          pulp repository list

          # Example of other Pulp operations
          # pulp artifact list --limit 5
          # pulp distribution list

