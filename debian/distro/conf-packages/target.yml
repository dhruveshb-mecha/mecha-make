packages:
  - firmware.group
  - linux.group
  - system.group
  - network.group
  - build.group
  - locale.group
  - wayland.group
  - greeter.group
  - audio.group
  - graphics.group
  - mechanix.group
package_groups:
  - name: system
    packages:
      - dbus
      - nano
      - openssh-server
      - sudo
      - bash-completion
      - dosfstools
      - upower
      - libglib2.0-0
      - glmark2-es2-wayland
      - gpiod
      - lsof
      - iw
      - udhcpc
  - name: network
    packages:
      - bluez
      - hostapd
      - file
      - ethtool
      - network-manager
      - net-tools
      - curl
      - wget
      - unzip
  - name: build
    packages:
      - python3
  - name: graphics
    packages:
      - mesa-utils
  - name: locale
    packages:
      - systemd-timesyncd
      - locales
      # - systemd-services
  - name: wayland
    packages:
      - xwayland
      - xorg
      # - meta-utils
      - libwlroots12t64
      - labwc
      - sway
      - weston
  - name: greeter
    packages:
      - greetd
  - name: audio
    packages:
      - pulseaudio
      - mpg123
      - pulseaudio-module-bluetooth
      - alsa-tools
      - alsa-utils
      - libasound2
      - libasound2-plugins
  - name: web
    packages:
      - chromium
